format:
  line_width: 100
  tab_size: 4
  dangle_parens: true
  max_subgroups_hwrap: 3
parse:
  additional_commands:
    execute_process:
      kwargs:
        COMMAND: '+'
        WORKING_DIRECTORY: 1
        RESULT_VARIABLE: 1
        OUTPUT_VARIABLE: 1
        COMMAND_ERROR_IS_FATAL: 1
    generate_export_header:
      pargs: 1
      kwargs:
        EXPORT_FILE_NAME: 1
        EXPORT_MACRO_NAME: 1
        STATIC_DEFINE: 1
markup:
  enable_markup: false
misc:
  per_command:
    execute_process:
      format.max_subgroups_hwrap: 0
